name: Pipeline CI/CD DataWeave CLI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-dataweave:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Configurare Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Instalare DataWeave CLI
        shell: bash
        run: |
          set -e

          VERSION="1.0.36"
          DW_DIR="$HOME/.dw"

          echo "Instalez DataWeave CLI v${VERSION}..."

          mkdir -p "$DW_DIR/bin"

          curl -fL \
            "https://github.com/mulesoft/data-weave-cli/releases/download/v${VERSION}/dw-${VERSION}-Linux" \
            -o /tmp/dataweave.zip

          echo "Verific arhiva..."
          file /tmp/dataweave.zip

          echo "Dezarhivez DataWeave CLI..."
          unzip -o /tmp/dataweave.zip -d /tmp/dataweave

          echo "Continutul arhivei:"
          find /tmp/dataweave -type f -maxdepth 3 -print

          echo "Caut executabilul dw..."

          DW_BINARY=$(find /tmp/dataweave -type f -name "dw" | head -1)

          if [ -z "$DW_BINARY" ]; then
            echo "Nu am găsit executabilul dw în arhivă."
            exit 1
          fi

          echo "Executabil găsit: $DW_BINARY"

          cp "$DW_BINARY" "$DW_DIR/bin/dw"

          chmod +x "$DW_DIR/bin/dw"

          echo "$DW_DIR/bin" >> "$GITHUB_PATH"

      - name: Verificare DataWeave CLI
        run: |
          dw --version

      - name: Validare script DataWeave
        run: |
          dw validate transformare.dw

      - name: Executare transformare DataWeave
        run: |
          dw run \
            -i payload="$PWD/input.json" \
            "$(cat transformare.dw)"
