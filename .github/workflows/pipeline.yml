name: Pipeline CI/CD DataWeave CLI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-dataweave:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout cod
      uses: actions/checkout@v4

    - name: Configurare Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalare DataWeave CLI
      run: |
        curl -sSL https://raw.githubusercontent.com/mulesoft-labs/data-weave-cli/main/scripts/install.sh | sh
        echo "$HOME/.dw/bin" >> $GITHUB_PATH

    - name: Executare si Validare Transformare DataWeave
      run: |
        dw -i payload input.json -f transformare.dw