name: Pipeline CI/CD DataWeave CLI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-dataweave:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Configurare Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Instalare DataWeave CLI
        shell: bash
        run: |
          set -e

          echo "Caut ultima versiune DataWeave CLI..."

          API_URL="https://api.github.com/repos/mulesoft/data-weave-cli/releases/latest"

          ASSET_URL=$(curl -fsSL "$API_URL" \
            | python3 -c '
          import sys, json

          data = json.load(sys.stdin)

          for asset in data["assets"]:
              name = asset["name"].lower()
              if "linux" in name and name.endswith(".zip"):
                  print(asset["browser_download_url"])
                  break
          ')

          if [ -z "$ASSET_URL" ]; then
            echo "Nu am găsit un asset Linux pentru DataWeave CLI."
            exit 1
          fi

          echo "Download: $ASSET_URL"

          mkdir -p "$HOME/.dw"

          curl -fL "$ASSET_URL" -o /tmp/dataweave.zip

          echo "Verific arhiva..."
          file /tmp/dataweave.zip

          unzip -o /tmp/dataweave.zip -d "$HOME/.dw"

          echo "$HOME/.dw/bin" >> "$GITHUB_PATH"

      - name: Verificare DataWeave CLI
        run: |
          dw --version

      - name: Validare script DataWeave
        run: |
          dw validate transformare.dw

      - name: Executare transformare DataWeave
        run: |
          dw run \
            -i payload="$PWD/input.json" \
            "$(cat transformare.dw)"
