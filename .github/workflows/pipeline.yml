name: Pipeline CI/CD DataWeave CLI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-dataweave:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Configurare Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Instalare DataWeave CLI
        shell: bash
        run: |
          set -e

          VERSION="1.0.36"
          DW_DIR="$HOME/.dw"

          echo "OS:"
          uname -a

          echo "Arhitectura:"
          uname -m

          mkdir -p "$DW_DIR/bin"

          echo "Descarc DataWeave CLI v${VERSION}..."

          curl -fL \
            "https://github.com/mulesoft/data-weave-cli/releases/download/v${VERSION}/dw-${VERSION}-Linux" \
            -o "$DW_DIR/bin/dw"

          chmod +x "$DW_DIR/bin/dw"

          echo "Tipul fisierului descarcat:"
          file "$DW_DIR/bin/dw"

          echo "Arhitectura ELF:"
          readelf -h "$DW_DIR/bin/dw" | grep -E "Class|Machine"

          echo "$DW_DIR/bin" >> "$GITHUB_PATH"

      - name: Verificare DataWeave CLI
        run: |
          dw --version

      - name: Validare script DataWeave
        run: |
          dw validate transformare.dw

      - name: Executare transformare DataWeave
        run: |
          dw run \
            -i payload="$PWD/input.json" \
            "$(cat transformare.dw)"