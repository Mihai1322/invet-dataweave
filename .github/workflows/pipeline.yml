name: Pipeline CI/CD DataWeave CLI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-dataweave:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Configurare Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Instalare DataWeave CLI
        run: |
          VERSION="1.0.36"

          mkdir -p "$HOME/.dw"

          curl -L \
            "https://github.com/mulesoft/data-weave-cli/releases/download/v${VERSION}/dw-linux-x64-v${VERSION}.zip" \
            -o /tmp/dw.zip

          unzip -o /tmp/dw.zip -d "$HOME/.dw"

          echo "$HOME/.dw/bin" >> "$GITHUB_PATH"

      - name: Verificare DataWeave CLI
        run: |
          dw --version

      - name: Executare transformare DataWeave
        run: |
          dw run \
            -i payload=input.json \
            "$(cat transformare.dw)"
